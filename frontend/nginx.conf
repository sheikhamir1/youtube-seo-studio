# ---------------------------------------------------------------------------
# Serves the built SPA and proxies the API to the backend container.
# - SPA fallback: every unknown path returns index.html (client-side routing).
# - /api is proxied to the backend service by its Compose name.
# - SSE needs proxy_buffering off, otherwise progress events arrive in bursts.
# ---------------------------------------------------------------------------
upstream backend_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Video uploads are sent as 32 MiB parts - allow generous bodies.
    client_max_body_size 64m;
    client_body_timeout 600s;
    send_timeout 600s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets can be cached aggressively; index.html never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # API proxy.
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Long-running chunk processing and large uploads.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
    }

    # Server-Sent Events for live job progress: never buffer, never cache.
    location ~ ^/api/v1/jobs/[^/]+/events/stream$ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # Streaming responses must not be buffered or cached.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # Client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
